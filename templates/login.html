<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>veraxIA — Entrar</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');
    :root{--gold:#c9a84c;--bg:#060b18;--card:#0d1220;--border:rgba(201,168,76,0.2);--tx:#f0ece0;--mu:rgba(240,236,224,0.5);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Outfit',-apple-system,sans-serif;background:var(--bg);color:var(--tx);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    body::before{content:'';position:fixed;top:-150px;left:50%;transform:translateX(-50%);
      width:600px;height:300px;background:radial-gradient(ellipse,rgba(201,168,76,0.1),transparent 70%);
      pointer-events:none;filter:blur(40px);}
    .box{background:var(--card);border:1px solid var(--border);border-radius:24px;
      padding:44px 40px;width:100%;max-width:400px;text-align:center;
      box-shadow:0 40px 80px rgba(0,0,0,0.5);}
    .logo{font-size:2rem;margin-bottom:8px;}
    h2{font-size:1.3rem;font-weight:700;color:var(--gold);margin-bottom:6px;}
    .sub{font-size:.85rem;color:var(--mu);margin-bottom:28px;}
    .field{width:100%;padding:13px 16px;background:rgba(255,255,255,0.04);
      border:1px solid var(--border);border-radius:12px;color:var(--tx);
      font-family:inherit;font-size:.9rem;margin-bottom:12px;outline:none;transition:border-color .2s;}
    .field:focus{border-color:var(--gold);}
    .btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),#a07830);
      color:#060b18;border:none;border-radius:12px;font-size:.95rem;font-weight:700;
      cursor:pointer;font-family:inherit;transition:opacity .2s,transform .15s;margin-top:4px;}
    .btn:hover{opacity:.9;transform:translateY(-1px);}
    .btn:disabled{opacity:.5;transform:none;cursor:not-allowed;}
    .msg{font-size:.83rem;margin-top:12px;display:none;padding:10px;border-radius:8px;}
    .msg.error{background:rgba(248,113,113,0.1);color:#f87171;}
    .msg.success{background:rgba(76,175,125,0.1);color:#4caf7d;}
    .links{margin-top:20px;display:flex;flex-direction:column;gap:8px;}
    .links a{color:var(--mu);font-size:.82rem;text-decoration:none;transition:color .2s;}
    .links a:hover{color:var(--gold);}
    .divider{height:1px;background:var(--border);margin:16px 0;}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">🧭</div>
    <h2>Bienvenido/a de vuelta</h2>
    <p class="sub">Entra a veraxIA y continúa tu conversación</p>
    <input class="field" type="email" id="email" placeholder="Tu email" 
      onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
    <input class="field" type="password" id="password" placeholder="Tu contraseña"
      onkeydown="if(event.key==='Enter')login()">
    <button class="btn" id="btn" onclick="login()">Entrar →</button>
    <p class="msg" id="msg"></p>
    <div class="divider"></div>
    <div class="links">
      <a href="/registro">¿No tienes cuenta? Regístrate gratis →</a>
    </div>
  </div>

  <script>
    async function login(){
      const email=document.getElementById('email').value.trim();
      const password=document.getElementById('password').value.trim();
      const btn=document.getElementById('btn');
      const msg=document.getElementById('msg');
      msg.style.display='none';
      if(!email||!password){
        msg.className='msg error';msg.textContent='Por favor completa todos los campos.';
        msg.style.display='block';return;
      }
      btn.disabled=true;btn.textContent='Entrando...';
      try{
        const res=await fetch('/login',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email,password})
        });
        const data=await res.json();
        if(res.ok&&data.ok){
          msg.className='msg success';
          msg.textContent='✅ ¡Bienvenido/a! Abriendo tu conversación...';
          msg.style.display='block';
          if(data.plan==='admin'){
            setTimeout(()=>{window.location.href='/admin';},800);
          }else{
            const nombre=encodeURIComponent(data.nombre||data.email.split('@')[0]);
            setTimeout(()=>{window.location.href='/?chat=open&nombre='+nombre;},800);
          }
        }else{
          msg.className='msg error';
          msg.textContent=data.error||'Email o contraseña incorrectos.';
          msg.style.display='block';
          btn.disabled=false;btn.textContent='Entrar →';
        }
      }catch(e){
        msg.className='msg error';msg.textContent='Error de conexión. Intenta de nuevo.';
        msg.style.display='block';btn.disabled=false;btn.textContent='Entrar →';
      }
    }
    // Focus automático
    document.getElementById('email').focus();
  </script>
</body>
</html>
